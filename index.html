.lensCellWrapV42{text-align:center;font-weight:700}
.lensCellV42{position:relative;width:118px;height:166px;margin-top:7px}

function render(){const z=q.value.trim().toLowerCase(),c=cat.value;grid.innerHTML="";E.filter(e=>(!c||e.category===c)&&(!z||[e.label,e.reading,e.meaning,e.usage,e.dots].join(" ").toLowerCase().includes(z))).forEach(e=>{const b=document.createElement("button");b.className="card";b.innerHTML=bh(e.dots)+"<span class='label'>"+esc(e.label)+"</span><span class='meta'>"+esc(e.category)+" / "+esc(e.dots)+"</span>";b.onclick=()=>show(e);grid.appendChild(b)})}
function show(e){selected=e;document.getElementById("d").innerHTML=bh(e.dots,true)+"<div class='kv'><b>項目</b><span>"+esc(e.label)+"</span><b>点番号</b><span>"+esc(e.dots)+"</span><b>Unicode</b><span>"+esc(e.unicode)+"</span><b>分類</b><span>"+esc(e.category)+"</span><b>説明</b><span>"+esc(e.meaning)+"</span><b>用途</b><span>"+esc(e.usage)+"</span></div>"}
function validate(){let bad=[];E.forEach(e=>{let a=e.dots.split("+").flatMap(x=>[...x].map(Number));if(a.some(n=>n<1||n>6)||new Set(a).size!==a.length)bad.push(e.label)});document.getElementById("report").innerHTML="<p class='"+(bad.length?"warn":"ok")+"'>構造検証："+(bad.length?"要確認 "+bad.length+"件":"OK")+"</p><p>同一点型グループ："+DATA.sameShapeGroups.length+"（同じ形を自動的に誤り扱いしません）</p>"}
q.oninput=render;cat.onchange=render;document.getElementById("val").onclick=validate;document.getElementById("spk").onclick=()=>selected&&speechSynthesis.speak(new SpeechSynthesisUtterance(selected.label+"。"+selected.meaning));render();validate();
</script>
<section id="brailleLensV42" aria-label="点字レンズ">
  <div class="lh">
    <div class="lt">🔍 点字レンズ</div>
    <button type="button" onclick="closeBrailleLensV42()">閉じる</button>
  </div>
  <div id="lensCellsV42"></div>
  <div id="lensMetaV42"></div>
  <div style="margin-top:8px">倍率：
    <button type="button" onclick="setBrailleLensScaleV42(1)">1×</button>
    <button type="button" onclick="setBrailleLensScaleV42(1.3)">1.3×</button>
    <button type="button" onclick="setBrailleLensScaleV42(1.6)">1.6×</button>
  </div>
  <div style="font-size:12px;color:#555;margin-top:7px">点番号：①左上・②左中・③左下／④右上・⑤右中・⑥右下</div>
</section>


<script>
(function(){
  let scale=1;

  function cellsOf(x){
    if(!x) return [];
    if(Array.isArray(x.cells)) return x.cells.map(c=>Array.isArray(c)?c.map(Number):[]);
    let p=x.pointPattern ?? x.pattern ?? x.dots;
    if(Array.isArray(p) && p.length && Array.isArray(p[0])) return p.map(c=>c.map(Number));
    if(Array.isArray(p)) return [p.map(Number)];
    if(typeof p==='string'){
      return p.split(/[+／\/\- ]+/).filter(Boolean)
        .map(v=>[...v].map(Number).filter(n=>n>=1&&n<=6));
    }
    return [];
  }

  function esc(v){
    return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  window.openBrailleLensV42=function(x){
    const cells=cellsOf(x);
    const holder=document.getElementById('lensCellsV42');
    holder.innerHTML='<div id="lensCellsInnerV42" style="display:flex;flex-wrap:wrap;gap:22px;justify-content:center;background:#f4f4f4;border-radius:14px;padding:16px">'
      + (cells.length?cells.map((dots,i)=>{
        const set=new Set(dots);
        return '<div class="lensCellWrapV42"><div>マス'+(i+1)+'</div><div class="lensCellV42" style="transform:scale('+scale+');transform-origin:top center">'
          +[1,2,3,4,5,6].map(n=>'<span class="lensDotV42 d'+n+' '+(set.has(n)?'on':'')+'" title="'+n+'点"></span>').join('')
          +'</div><div style="font-size:13px">凸点：'+(dots.length?esc(dots.join('・')):'なし')+'</div></div>';
      }).join(''):'<div>点字データがありません</div>')+'</div>';

    const label=x.label||x.name||x.kana||'';
    const reading=x.reading||x.yomi||'';
    const meaning=x.meaning||x.description||'';
    document.getElementById('lensMetaV42').innerHTML='<div><strong>'+esc(label)+'</strong>'+(reading?'（'+esc(reading)+'）':'')+'</div>'
      +(meaning?'<div>'+esc(meaning)+'</div>':'')
      +'<div class="raised">点字セル数：'+cells.length+'</div>';
    document.getElementById('brailleLensV42').classList.add('open');
  };

  window.closeBrailleLensV42=function(){
    document.getElementById('brailleLensV42').classList.remove('open');
  };

  window.setBrailleLensScaleV42=function(v){
    scale=v;
    document.querySelectorAll('#lensCellsInnerV42 .lensCellV42').forEach(el=>el.style.transform='scale('+scale+')');
  };

  window.showBrailleLens=window.openBrailleLensV42;

  document.addEventListener('click',function(e){
    const b=e.target.closest('.brailleButton,[data-braille-id],[data-id]');
    if(!b) return;
    let x=b.__brailleItem||null;
    const id=b.dataset.brailleId||b.dataset.id;
    const pools=[window.BRAILLE_DATA,window.dictionary,window.BRAILLE_DICTIONARY,window.DATA];
    if(!x && id) for(const a of pools){
      if(Array.isArray(a)){x=a.find(v=>String(v.id)===String(id));if(x)break;}
    }
    if(x) setTimeout(()=>openBrailleLensV42(x),0);
  },true);
})();
</script>

</body></html>
